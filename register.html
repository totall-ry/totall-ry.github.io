<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Campus Bulletin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("e8mvIOZJuoRXgs_K5");
        })();
    </script>
</head>
<body class="hku-shell font-sans min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="glass-panel max-w-md w-full p-8 space-y-6 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl">
        <div class="text-center">
            <p class="text-xs font-bold uppercase tracking-[0.24em] text-[#7c8f6a]">Authentication Gate</p>
            <h2 class="text-2xl font-bold text-[#1f2d1f] mt-1">Create Student Account</h2>
            <p class="text-xs text-stone-500 mt-1">Verify your identity to post on the digital board</p>
        </div>

        <div class="space-y-4">
            <form id="registrationForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-[#3e5c3b] uppercase mb-1">Full Identity Name</label>
                    <input type="text" id="regFullName" required placeholder="e.g. Chan Tai Man"
                        class="field w-full px-3 py-2 border rounded-lg focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#3e5c3b] uppercase mb-1">Username</label>
                    <input type="text" id="regUsername" required placeholder="e.g. taimando99"
                        class="field w-full px-3 py-2 border rounded-lg focus:outline-none text-sm">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-[#3e5c3b] uppercase mb-1">University ID (10 digits)</label>
                        <input type="text" id="regUniversityId" required placeholder="e.g. 3035123456" maxlength="10" pattern="[0-9]*"
                            class="field w-full px-3 py-2 border rounded-lg focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-[#3e5c3b] uppercase mb-1">Choose Password</label>
                        <input type="password" id="regPassword" required placeholder="••••••••" minlength="6"
                            class="field w-full px-3 py-2 border rounded-lg focus:outline-none text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#3e5c3b] uppercase mb-1">HKU Portal / Preferred Email</label>
                    <input type="email" id="regPreferredEmail" required placeholder="e.g. u35xxxxx@connect.hku.hk"
                        class="field w-full px-3 py-2 border rounded-lg focus:outline-none text-sm">
                </div>

                <button type="submit" class="primary-btn w-full py-2.5 text-white font-semibold rounded-lg transition text-sm shadow-md mt-2">
                    Send Verification OTP
                </button>
            </form>

            <div id="otpVerificationSection" class="hidden space-y-4 border-t border-[#d9d2c3]/60 pt-4 animate-fade-in">
                <div class="bg-[#f6f1e7]/40 border border-[#d9d2c3] rounded-xl p-3.5 text-center">
                    <p class="text-xs text-[#5a3e2b]">An identity token passcode was routed to your email inbox. Please enter the 6-digit sequence below to complete registration.</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#3e5c3b] uppercase mb-1 text-center">One-Time Password</label>
                    <input type="text" id="otpInput" placeholder="••••••" maxlength="6" pattern="[0-9]*"
                        class="w-full text-center tracking-[0.5em] font-mono text-xl font-bold px-3 py-2 border rounded-lg focus:outline-none bg-[#fffcf6] border-[#d9d2c3]">
                </div>

                <button type="button" id="verifyOtpBtn" class="bg-gradient-to-r from-[#3e5c3b] to-[#1f2d1f] hover:brightness-110 w-full py-2.5 text-white font-semibold rounded-lg transition text-sm shadow-md">
                    Verify & Create Account
                </button>
                
                <p class="text-center text-[11px] text-stone-500">
                    Didn't receive it? <button type="button" id="resendOtpBtn" class="text-[#3e5c3b] font-bold underline hover:text-[#1f2d1f]">Resend code</button>
                </p>
            </div>
        </div>

        <div class="pt-2 text-center">
            <a href="index.html" class="text-xs font-bold text-[#5a3e2b]/80 hover:text-[#1f2d1f] transition underline">
                ← Return to Login Gateway
            </a>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, doc, setDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        // Global Configuration parameters
        const EMAILJS_SERVICE_ID = "service_soxo4ub"; //
        const EMAILJS_TEMPLATE_ID = "template_8ak0t74"; //

        // Local ephemeral runtime state variables
        let systemGeneratedOTP = null;
        let pendingRegistrationPayload = null;

        const registrationForm = document.getElementById('registrationForm');
        const otpSection = document.getElementById('otpVerificationSection');
        const otpInput = document.getElementById('otpInput');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const resendOtpBtn = document.getElementById('resendOtpBtn');

        /**
         * Core Sequence Step 1: Validates unique field constraints, builds OTP token, and delivers email
         */
        registrationForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const universityId = document.getElementById('regUniversityId').value.trim();
            const email = document.getElementById('regPreferredEmail').value.trim();

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying inputs...';

            try {
                // Pointing specifically to your "users" collection
                const usersRef = collection(db, "users");

                // 1. DUAL CHECK REPLICATES: Run separate queries to spot duplicates across fields
                const usernameQuery = query(usersRef, where("username", "==", username));
                const idQuery = query(usersRef, where("universityId", "==", universityId));
                const emailQuery = query(usersRef, where("preferredEmail", "==", email));

                const [usernameSnap, idSnap, emailSnap] = await Promise.all([
                    getDocs(usernameQuery),
                    getDocs(idQuery),
                    getDocs(emailQuery)
                ]);

                // If any match is found, throw an error, block execution, and direct them to Login
                if (!usernameSnap.empty || !idSnap.empty || !emailSnap.empty) {
                    let duplicateField = "";
                    if (!usernameSnap.empty) duplicateField = "Username";
                    else if (!idSnap.empty) duplicateField = "University ID";
                    else if (!emailSnap.empty) duplicateField = "Email Address";

                    alert(`Registration Failed: This ${duplicateField} is already linked to an existing account. Please log in directly.`);
                    
                    // Reset operational state back to normal
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Verification OTP';
                    return;
                }

                // 2. Cache formal field configurations locally matching your exact document design
                pendingRegistrationPayload = {
                    fullName: document.getElementById('regFullName').value.trim(),
                    identityRole: "student", // Matches schema requirement perfectly
                    username: username,
                    universityId: universityId,
                    preferredEmail: email,
                    password: document.getElementById('regPassword').value, 
                    createdAt: serverTimestamp()
                };

                // 3. Fire execution path to generate and send OTP token
                sendOTP(email);

            } catch (error) {
                console.error("Validation sequence failed:", error);
                alert("Network communication failure: " + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Verification OTP';
            }
        });

        /**
         * Generates security codes and communicates directly with EmailJS channels
         */
        function sendOTP(targetEmail) {
            const generatedPasscode = Math.floor(100000 + Math.random() * 900000).toString();
            systemGeneratedOTP = generatedPasscode;

            const expiryClock = new Date();
            expiryClock.setMinutes(expiryClock.getMinutes() + 15);
            const formattedExpiryString = expiryClock.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });

            const emailTemplateVariables = {
                to_email: targetEmail,
                passcode: generatedPasscode, // Matches template binding field
                time: formattedExpiryString
            };

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, emailTemplateVariables)
                .then(() => {
                    alert(`A secure verification passcode has been dispatched to: ${targetEmail}\n\nCode remains valid for 15 minutes until ${formattedExpiryString}.`);
                    
                    otpSection.classList.remove('hidden');
                    
                    // Freeze input fields during validation challenge
                    document.getElementById('regFullName').setAttribute('disabled', 'true');
                    document.getElementById('regUsername').setAttribute('disabled', 'true');
                    document.getElementById('regUniversityId').setAttribute('disabled', 'true');
                    document.getElementById('regPreferredEmail').setAttribute('disabled', 'true');
                    document.getElementById('regPassword').setAttribute('disabled', 'true');
                    
                    const submitBtn = registrationForm.querySelector('button[type="submit"]');
                    submitBtn.textContent = 'Code Sent Successfully';
                })
                .catch((emailError) => {
                    console.error("EmailJS delivery loop crashed:", emailError);
                    alert("Failed to deliver security verification token: " + emailError.text);
                    
                    const submitBtn = registrationForm.querySelector('button[type="submit"]');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Verification OTP';
                });
        }

        /**
         * Core Sequence Step 2: Validates token, saves user account with custom doc ID, and updates session
         */
        verifyOtpBtn.addEventListener('click', async function() {
            const userInputCode = otpInput.value.trim();

            if (!userInputCode) {
                alert("Please input the 6-digit verification code sent to your email.");
                return;
            }

            if (userInputCode !== systemGeneratedOTP) {
                alert("The verification code you provided does not match our records. Please verify input or click resend.");
                return;
            }

            verifyOtpBtn.disabled = true;
            verifyOtpBtn.textContent = 'Creating Account...';

            try {
                // Using setDoc with username as custom Document ID
                const customUserDocRef = doc(db, "users", pendingRegistrationPayload.username);
                await setDoc(customUserDocRef, pendingRegistrationPayload);

                // Set local session variables to automatically log in the student
                sessionStorage.setItem('bulletinActiveStudent', JSON.stringify({
                    fullName: pendingRegistrationPayload.fullName,
                    username: pendingRegistrationPayload.username,
                    universityId: pendingRegistrationPayload.universityId,
                    preferredEmail: pendingRegistrationPayload.preferredEmail
                }));
                sessionStorage.setItem('bulletinSessionRole', 'student'); //

                alert("Verification Successful! Your student account has been registered.");
                
                systemGeneratedOTP = null;
                window.location.href = 'submit.html';

            } catch (firestoreError) {
                console.error("Failed to commit user record:", firestoreError);
                alert("Database transactional state failure: " + firestoreError.message);
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.textContent = 'Verify & Create Account';
            }
        });

        resendOtpBtn.addEventListener('click', function() {
            if (pendingRegistrationPayload && pendingRegistrationPayload.preferredEmail) {
                sendOTP(pendingRegistrationPayload.preferredEmail);
            }
        });
    </script>
</body>
</html>
