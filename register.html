<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Campus Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="hku-shell font-sans min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="glass-panel max-w-5xl w-full overflow-hidden grid md:grid-cols-5 rounded-2xl">
        <div class="campus-panel p-8 text-white md:col-span-2 flex flex-col justify-between min-h-[420px]">
            <div>
                <div class="inline-flex accent-pill rounded-full px-3 py-1 text-xs font-semibold uppercase tracking-wide mb-5">
                    Account Registration
                </div>
                <h2 class="text-3xl font-black leading-tight mb-4">Join the Bulletin Network</h2>
                <p class="text-stone-100/90 text-sm leading-relaxed">
                    Create your permanent campus member signature to directly post, manage, and verify event notice updates.
                </p>
            </div>
            <div class="text-[11px] text-stone-100/60 font-mono tracking-wider">
                HKU Digital Board Registration Matrix v1.2
            </div>
        </div>

        <form id="registrationForm" class="p-8 md:p-10 md:col-span-3 space-y-4 bg-white/95 backdrop-blur-md flex flex-col justify-center">
            <div>
                <p class="text-xs font-bold uppercase tracking-[0.24em] text-[#7c8f6a]">Registration</p>
                <h2 class="text-2xl font-bold text-[#1f2d1f] mt-1">Create Student Profile</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-[#3e5c3b] uppercase mb-1">Username</label>
                    <input type="text" id="username" required placeholder="Choose username"
                        class="field w-full px-3 py-2 border rounded-lg focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#3e5c3b] uppercase mb-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="field w-full px-3 py-2 border rounded-lg focus:outline-none text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-[#3e5c3b] uppercase mb-1">Full Identity Name</label>
                <input type="text" id="fullName" required placeholder="e.g. Mok Cheuk Hin"
                    class="field w-full px-3 py-2 border rounded-lg focus:outline-none text-sm">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-[#3e5c3b] uppercase mb-1">University ID</label>
                    <input type="text" id="universityId" required placeholder="10-digit ID" maxlength="10" pattern="[0-9]*"
                        class="field w-full px-3 py-2 border rounded-lg focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#3e5c3b] uppercase mb-1">Preferred Email</label>
                    <input type="email" id="email" required placeholder="name@hku.hk"
                        class="field w-full px-3 py-2 border rounded-lg focus:outline-none text-sm">
                </div>
            </div>

            <button type="submit" class="primary-btn w-full text-white font-semibold py-2.5 rounded-lg transition text-sm mt-2 shadow-lg">
                Complete Registration
            </button>

            <div class="pt-2 text-center border-t border-[#d9d2c3]">
                <p class="text-xs text-[#5a3e2b]/70">
                    Already possess active access details? 
                    <a href="index.html" class="text-[#3e5c3b] font-bold hover:underline">Sign In here</a>
                </p>
            </div>
        </form>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value;
            const fullNameInput = document.getElementById('fullName').value.trim();
            const universityIdInput = document.getElementById('universityId').value.trim();
            const emailInput = document.getElementById('email').value.trim();

            try {
                // Duplication Check: Make sure username document path is vacant before writing
                const userRef = doc(db, "users", usernameInput);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    alert(`Registration Failed: The username "${usernameInput}" is already taken.`);
                    return;
                }

                // Payload Assembly matching your custom cloud schema explicitly
                const userPayload = {
                    password: passwordInput,
                    identityRole: 'student', // <-- Directly ensures uniform data storage keys inside cloud documents
                    fullName: fullNameInput,
                    universityId: universityIdInput,
                    preferredEmail: emailInput
                };

                // Save user profile state into Cloud Firestore users collection array maps
                await setDoc(userRef, userPayload);
                
                alert('Account successfully registered! Proceeding to portal gateway.');
                window.location.href = 'index.html';

            } catch (err) {
                alert("Database registration error: " + err.message);
            }
        });
    </script>
</body>
</html>
