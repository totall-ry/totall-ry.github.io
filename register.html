<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Campus Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./firebase.js"></script>
</head>
<body class="bg-slate-900 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 space-y-5">
        <div class="text-center">
            <h2 class="text-2xl font-bold text-slate-800">Create Account</h2>
            <p class="text-sm text-slate-500 mt-1">Register as a student system member</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                <input type="text" id="regUsername" required placeholder="Choose a unique username" 
                    pattern="[A-Za-z0-9_]+" title="English characters and numbers only."
                    oninput="this.value = this.value.replace(/[^A-Za-z0-9_]/g, '')"
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <input type="password" id="regPassword" required placeholder="••••••••" 
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <div class="border-t border-slate-100 pt-3">
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Full Name</label>
                <input type="text" id="regFullName" required placeholder="Chris Wong" 
                    pattern="[A-Za-z\s]+" title="English letters and spaces only."
                    oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')"
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">University ID</label>
                <input type="text" id="regUid" required minlength="10" maxlength="10" pattern="[0-9]*"
                    title="University ID must be exactly 10 digits long and contain only numbers." placeholder="10 Digits (e.g. 1234567890)" 
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Preferred Notification Email</label>
                <input type="email" id="regEmail" required placeholder="chriswong@example.com" 
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>

            <div id="errorBox" class="text-red-500 text-xs hidden text-center font-medium bg-red-50 py-2 rounded-lg border border-red-100"></div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm mt-2">
                Register Account
            </button>
        </form>

        <div class="border-t border-slate-100 pt-4 text-center text-xs text-slate-500">
            Already have an account? <a href="index.html" class="font-medium text-blue-600 hover:underline">Log in here</a>
        </div>
    </div>

    <script type="module">
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        const registerForm = document.getElementById('registerForm');
        const submitBtn = registerForm.querySelector('button[type="submit"]');

        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-60', 'cursor-not-allowed');
        submitBtn.innerText = "Connecting to Cloud...";

        const checkDb = setInterval(() => {
            if (window.db) {
                clearInterval(checkDb);
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                submitBtn.innerText = "Register Account";
            }
        }, 100);

        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const fullName = document.getElementById('regFullName').value.trim();
            const universityId = document.getElementById('regUid').value;
            const preferredEmail = document.getElementById('regEmail').value.trim();
            const errorBox = document.getElementById('errorBox');

            errorBox.classList.add('hidden');

            if (username === 'admin') {
                errorBox.innerText = "System keyword reserved for Root Administrator access.";
                errorBox.classList.remove('hidden');
                return;
            }

            try {
                const userDocRef = doc(window.db, "users", username);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    errorBox.innerText = "Username already taken. Choose another.";
                    errorBox.classList.remove('hidden');
                    return;
                }

                await setDoc(userDocRef, { username, password, fullName, universityId, preferredEmail });

                alert('Account successfully created on cloud database! Moving to gateway login.');
                window.location.href = 'index.html';
            } catch (err) {
                errorBox.innerText = "Database Write Error: " + err.message;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
