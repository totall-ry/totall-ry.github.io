<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Campus Display Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth transitions for slide transitions */
        .slide-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 380px; /* Locked viewport container depth constraints */
        }
        .billboard-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateX(100%);
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease-in-out;
            pointer-events: none;
        }
        /* Active View state: Slides into view from the right */
        .billboard-slide.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }
        /* Exit state: Slides away out towards the left side window margin */
        .billboard-slide.exit {
            opacity: 0;
            transform: translateX(-100%);
        }
    </style>
</head>
<body class="bg-slate-950 font-sans text-slate-100 min-h-screen flex flex-col justify-between overflow-hidden">

    <header class="bg-slate-900 border-b border-slate-800 px-8 py-6 flex justify-between items-center shadow-md z-10">
        <div>
            <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 uppercase">Campus Live Bulletin</h1>
            <p class="text-xs text-slate-400 mt-1">Authorized Announcements Panel</p>
        </div>
        <div class="flex items-center space-x-6">
            <a href="index.html" class="text-xs text-slate-400 hover:text-white underline">Portal Gate</a>
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span class="text-xs font-mono font-bold tracking-widest uppercase text-slate-400">Live Feed</span>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 md:px-12 lg:px-24 max-w-5xl mx-auto w-full">
        <div id="carouselTrack" class="slide-container">
            </div>
    </main>

    <footer class="bg-slate-900/50 border-t border-slate-900 px-8 py-4 text-center text-xs text-slate-600 flex justify-between items-center z-10">
        <span>To submit announcements onto this monitor screen, access the digital intake portal gateway.</span>
        <span id="slideCounter" class="font-mono bg-slate-950 border border-slate-800 text-slate-400 px-3 py-1 rounded-full text-[11px] font-bold">Item 0 of 0</span>
    </footer>

    <script>
        let currentIndex = 0;
        let slideInterval = null;
        const animationSpeedDuration = 5000; // Time each announcement stays on screen (5 seconds)

        function buildBillboardCarousel() {
            const track = document.getElementById('carouselTrack');
            const counter = document.getElementById('slideCounter');
            const submissions = JSON.parse(localStorage.getItem('bulletinSubmissions')) || [];
            
            // Extract explicitly approved items
            const activeNotices = submissions.filter(item => item.status === 'approved');

            // Handle empty slate architecture scenarios elegantly
            if(activeNotices.length === 0) {
                track.innerHTML = `
                    <div class="w-full h-full flex flex-col items-center justify-center text-center">
                        <p class="text-slate-400 text-xl font-semibold tracking-wide">No Broadcast Messages Active</p>
                        <p class="text-slate-600 text-sm mt-1">Approved announcements will automatically stream onto this board live.</p>
                    </div>
                `;
                counter.innerText = "Item 0 of 0";
                if(slideInterval) clearInterval(slideInterval);
                return;
            }

            track.innerHTML = '';

            // Generate clean isolated slide nodes
            activeNotices.forEach((item, index) => {
                const slide = document.createElement('div');
                
                const isClub = item.affiliationType === 'Club';
                const borderTheme = isClub ? 'border-blue-500/40 shadow-blue-950/40' : 'border-emerald-500/40 shadow-emerald-950/40';
                const badgeTheme = isClub ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

                slide.className = `billboard-slide flex flex-col justify-between bg-slate-900 border-2 rounded-2xl p-8 md:p-12 shadow-2xl ${borderTheme}`;
                slide.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-6">
                            <span class="text-sm font-extrabold uppercase tracking-widest px-3.5 py-1.5 rounded-lg border ${badgeTheme}">
                                ${item.affiliationName}
                            </span>
                            <span class="text-xs font-mono text-slate-500 uppercase font-semibold tracking-wider">Date: ${item.displayDate}</span>
                        </div>
                        <p class="text-2xl md:text-3xl text-slate-100 font-medium leading-relaxed tracking-wide break-words">
                            "${item.message}"
                        </p>
                    </div>
                    <div class="border-t border-slate-800/80 mt-8 pt-6 text-xs md:text-sm text-slate-500 flex justify-between items-center font-medium tracking-wide">
                        <span>Issuer signature: ${item.fullName}</span>
                        <span class="font-mono bg-slate-950/60 border border-slate-800 px-3 py-1 rounded-md text-slate-400 text-xs">ID: ****${item.universityId.slice(-4)}</span>
                    </div>
                `;
                track.appendChild(slide);
            });

            // Reset indexing loop tracking matrices safely
            currentIndex = 0;
            startCarouselLogic(activeNotices.length);
        }

        function startCarouselLogic(totalSlides) {
            const slides = document.querySelectorAll('.billboard-slide');
            const counter = document.getElementById('slideCounter');
            
            if(slides.length === 0) return;

            // Paint initial standard viewing item active visibility indicators immediately 
            slides[0].classList.add('active');
            counter.innerText = `Item 1 of ${totalSlides}`;

            // Safety cleanup before binding intervals
            if (slideInterval) clearInterval(slideInterval);

            // If there's only 1 item, don't execute movement loops
            if (totalSlides === 1) return;

            // Bind alternating rotation runtime loop tracking arrays
            slideInterval = setInterval(() => {
                const previousSlide = slides[currentIndex];
                
                // Advance counter forward with wrapping parameters back to zero index
                currentIndex = (currentIndex + 1) % totalSlides;
                const nextSlide = slides[currentIndex];

                // Trigger leftward exit animation transition state on old active block
                previousSlide.classList.remove('active');
                previousSlide.classList.add('exit');

                // Animate entry frame target smoothly arriving out from the rightward direction
                nextSlide.classList.remove('exit');
                nextSlide.classList.add('active');

                // Clean exit parameters after transition timeframe ends
                setTimeout(() => {
                    previousSlide.classList.remove('exit');
                }, 800);

                // Update counter signature badge component node text references
                counter.innerText = `Item ${currentIndex + 1} of ${totalSlides}`;
            }, animationSpeedDuration);
        }

        // Run bootstrap operations loop layout parsing
        buildBillboardCarousel();

        // Periodically verify background LocalStorage storage mutations silently every 15s to keep board updated
        setInterval(() => {
            const originalCount = document.querySelectorAll('.billboard-slide').length;
            const submissions = JSON.parse(localStorage.getItem('bulletinSubmissions')) || [];
            const activeCount = submissions.filter(item => item.status === 'approved').length;
            
            // Re-render only if items were added/removed to avoid layout flickering
            if(originalCount !== activeCount) {
                buildBillboardCarousel();
            }
        }, 15000);
    </script>
</body>
</html>
