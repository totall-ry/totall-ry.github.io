<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Display | Campus Bulletin Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./firebase.js"></script>
    <style>
        /* Carousel horizontal slide animations */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 600px; /* Expands height to give massive layout breathing room */
            overflow: hidden;
        }
        .carousel-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateX(100%);
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease-in-out;
            pointer-events: none;
        }
        .carousel-card.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }
        .carousel-card.exit {
            opacity: 0;
            transform: translateX(-100%);
            pointer-events: none;
        }
        /* Custom slide animation for manual reverse tracking (Previous Button) */
        .carousel-card.exit-reverse {
            opacity: 0;
            transform: translateX(100%);
            pointer-events: none;
        }
        .carousel-card.enter-reverse {
            opacity: 0;
            transform: translateX(-100%);
            transition: none;
        }
    </style>
</head>
<body class="bg-slate-950 font-sans min-h-screen text-slate-100 p-6 flex flex-col justify-between items-center">

    <header class="w-full max-w-6xl mx-auto flex flex-col items-center text-center border-b border-slate-800 pb-4 mb-4 gap-1">
        <h1 class="text-2xl font-extrabold tracking-tight text-white flex items-center justify-center gap-3">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            Campus Live Information Board
        </h1>
        <p class="text-xs text-slate-400">Real-time approved student activity feeds</p>
        <a href="index.html" class="mt-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-semibold px-4 py-1.5 rounded-xl transition text-slate-300">
            &larr; Access Portal
        </a>
    </header>

    <main class="w-full max-w-7xl mx-auto flex-grow flex items-center justify-center gap-6">
        
        <button id="prevBtn" class="hidden md:flex items-center justify-center w-14 h-14 rounded-full bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-white transition active:scale-95 shadow-xl shrink-0 z-10 text-xl font-bold">
            &#8592;
        </button>

        <div id="displayBoardGrid" class="carousel-container flex-grow max-w-6xl">
            <div class="w-full h-full flex items-center justify-center text-slate-500 font-medium bg-slate-900/40 rounded-2xl border border-slate-900 border-dashed animate-pulse">
                Synchronizing live grid interface matrix channels...
            </div>
        </div>

        <button id="nextBtn" class="hidden md:flex items-center justify-center w-14 h-14 rounded-full bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-white transition active:scale-95 shadow-xl shrink-0 z-10 text-xl font-bold">
            &#8594;
        </button>

    </main>

    <footer class="w-full max-w-6xl mx-auto pt-4 flex justify-center gap-2" id="carouselIndicators">
    </footer>

    <script type="module">
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        let noticesData = [];
        let activeCardIndex = 0;
        let rotationTimer = null;
        const ROTATION_DELAY = 8000; // Increased to 8 seconds as requested!

        async function loadPublicBoard() {
            const db = window.db;
            const grid = document.getElementById('displayBoardGrid');

            if (!db) {
                setTimeout(loadPublicBoard, 250);
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "bulletinSubmissions"));
                noticesData = [];

                querySnapshot.forEach((docInstance) => {
                    const notice = docInstance.data();
                    if (notice.status === 'approved') {
                        noticesData.push(notice);
                    }
                });

                noticesData.sort((a, b) => b.id.localeCompare(a.id));

                if (noticesData.length === 0) {
                    grid.innerHTML = `
                        <div class="w-full h-full flex items-center justify-center text-center text-slate-500 font-medium bg-slate-900/30 rounded-2xl border border-slate-900 border-dashed p-8">
                            No approved announcements are currently set for display.
                        </div>`;
                    document.getElementById('carouselIndicators').innerHTML = "";
                    document.getElementById('prevBtn').classList.add('hidden');
                    document.getElementById('nextBtn').classList.add('hidden');
                    return;
                }

                // Show navigation arrows if notices are available
                if (noticesData.length > 1) {
                    document.getElementById('prevBtn').classList.remove('hidden');
                    document.getElementById('nextBtn').classList.remove('hidden');
                }

                buildCarouselMarkup();
                startCarouselRotation();

            } catch (err) {
                grid.innerHTML = `<div class="w-full p-4 text-center text-red-400 font-mono font-semibold bg-red-950/20 border border-red-900/50 rounded-xl">Terminal Linkage Loss: ${err.message}</div>`;
            }
        }

        // Helper function to calculate font size class based on message length
        function getDynamicTextSizeClass(messageText) {
            const charCount = messageText.length;
            
            if (charCount <= 80) {
                return "text-4xl md:text-5xl font-extrabold tracking-wide"; 
            } else if (charCount <= 160) {
                return "text-2xl md:text-3xl font-bold tracking-wide";      
            } else {
                return "text-xl md:text-2xl font-semibold leading-relaxed"; 
            }
        }

        function buildCarouselMarkup() {
            const grid = document.getElementById('displayBoardGrid');
            const indicatorsContainer = document.getElementById('carouselIndicators');
            
            grid.innerHTML = "";
            indicatorsContainer.innerHTML = "";

            noticesData.forEach((notice, idx) => {
                const badgeColor = notice.affiliationType === 'Faculty' ? 'bg-purple-500/10 text-purple-400 border-purple-500/20' : 'bg-blue-500/10 text-blue-400 border-blue-500/20';
                
                const cleanMessage = (notice.message || '').trim();
                const cleanAffiliation = (notice.affiliationName || '').trim();
                const dynamicSizeClass = getDynamicTextSizeClass(cleanMessage);

                const cardElement = document.createElement('div');
                cardElement.id = `card-${idx}`;
                cardElement.className = `carousel-card bg-slate-900 border border-slate-800 rounded-2xl p-8 flex flex-col justify-between shadow-2xl`;
                cardElement.innerHTML = `
                    <div class="flex flex-col h-full justify-between space-y-4">
                        <div class="flex items-center justify-between w-full">
                            <span class="px-3 py-1 text-[11px] font-bold uppercase rounded-md border ${badgeColor}">
                                ${notice.affiliationType || 'Club'}
                            </span>
                            <span class="text-[11px] font-mono font-medium text-slate-500 bg-slate-950 px-2.5 py-1 rounded-md">
                                Date: ${notice.displayDate || '---'}
                            </span>
                        </div>
                        
                        <div class="text-center w-full">
                            <h3 class="text-3xl font-extrabold text-white tracking-tight mx-auto max-w-4xl">${cleanAffiliation || 'General Announcement'}</h3>
                            <p class="text-xs text-slate-400 mt-1.5 font-medium">Posted by: ${notice.fullName || 'Anonymous'}</p>
                        </div>

                        <div class="w-full flex-grow bg-slate-950/60 rounded-xl border border-slate-850 p-8 flex items-center justify-center">
                            <p class="${dynamicSizeClass} text-slate-100 text-center w-full max-w-5xl mx-auto break-words whitespace-pre-line">
                                ${cleanMessage || 'No announcement details specified.'}
                            </p>
                        </div>

                        <div class="pt-3 border-t border-slate-850 flex items-center justify-between text-[11px] font-mono text-slate-500 w-full">
                            <span>Ref: #${notice.id ? notice.id.slice(-6) : '000000'}</span>
                            <span class="text-emerald-500 font-bold uppercase tracking-wider flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Verified Notice
                            </span>
                        </div>
                    </div>
                `;
                grid.appendChild(cardElement);

                const indicatorDot = document.createElement('button');
                indicatorDot.id = `dot-${idx}`;
                indicatorDot.className = `w-2.5 h-2.5 rounded-full bg-slate-800 transition-all duration-300 focus:outline-none`;
                indicatorDot.onclick = () => jumpToCard(idx);
                indicatorsContainer.appendChild(indicatorDot);
            });

            activeCardIndex = 0;
            updateDOMState(null, activeCardIndex);
        }

        function updateDOMState(oldIdx, newIdx, direction = 'next') {
            if (oldIdx !== null) {
                const oldCard = document.getElementById(`card-${oldIdx}`);
                const oldDot = document.getElementById(`dot-${oldIdx}`);
                if (oldCard) {
                    oldCard.className = `carousel-card bg-slate-900 border border-slate-800 rounded-2xl p-8 flex flex-col justify-between shadow-2xl ${direction === 'next' ? 'exit' : 'exit-reverse'}`;
                }
                if (oldDot) oldDot.className = "w-2.5 h-2.5 rounded-full bg-slate-800 transition-all duration-300 focus:outline-none";
            }

            const newCard = document.getElementById(`card-${newIdx}`);
            const newDot = document.getElementById(`dot-${newIdx}`);
            
            if (newCard) {
                if (direction === 'prev') {
                    // Set up entry layout variant position for backwards travel tracking
                    newCard.className = "carousel-card bg-slate-900 border border-slate-800 rounded-2xl p-8 flex flex-col justify-between shadow-2xl enter-reverse";
                    // Force DOM reflow to process layout swap instantly before triggering transition
                    newCard.offsetHeight; 
                }

                setTimeout(() => {
                    noticesData.forEach((_, i) => {
                        if (i !== newIdx && i !== oldIdx) {
                            const clearCard = document.getElementById(`card-${i}`);
                            if (clearCard) clearCard.className = "carousel-card bg-slate-900 border border-slate-800 rounded-2xl p-8 flex flex-col justify-between shadow-2xl";
                        }
                    });
                }, 750);

                newCard.className = "carousel-card bg-slate-900 border border-slate-800 rounded-2xl p-8 flex flex-col justify-between shadow-2xl active";
            }
            if (newDot) newDot.className = "w-6 h-2.5 rounded-full bg-blue-500 transition-all duration-300 focus:outline-none";
        }

        function rotateNextCard() {
            if (noticesData.length <= 1) return;
            const oldIdx = activeCardIndex;
            activeCardIndex = (activeCardIndex + 1) % noticesData.length;
            updateDOMState(oldIdx, activeCardIndex, 'next');
        }

        function rotatePrevCard() {
            if (noticesData.length <= 1) return;
            const oldIdx = activeCardIndex;
            activeCardIndex = (activeCardIndex - 1 + noticesData.length) % noticesData.length;
            updateDOMState(oldIdx, activeCardIndex, 'prev');
            startCarouselRotation(); // Reset the 8s idling window
        }

        function startCarouselRotation() {
            if (rotationTimer) clearInterval(rotationTimer);
            if (noticesData.length > 1) {
                rotationTimer = setInterval(rotateNextCard, ROTATION_DELAY);
            }
        }

        function jumpToCard(targetIdx) {
            if (targetIdx === activeCardIndex) return;
            const oldIdx = activeCardIndex;
            const direction = targetIdx > activeCardIndex ? 'next' : 'prev';
            activeCardIndex = targetIdx;
            updateDOMState(oldIdx, activeCardIndex, direction);
            startCarouselRotation();
        }

        // Attach Click Event Handlers directly to buttons
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (noticesData.length <= 1) return;
            rotateNextCard();
            startCarouselRotation(); // Resets timer countdown cleanly
        });

        document.getElementById('prevBtn').addEventListener('click', rotatePrevCard);

        loadPublicBoard();
    </script>
</body>
</html>
