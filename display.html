<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Display | Campus Bulletin Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./firebase.js"></script>
</head>
<body class="bg-slate-950 font-sans min-h-screen text-slate-100 p-8">

    <header class="max-w-7xl mx-auto flex justify-between items-center border-b border-slate-800 pb-6 mb-8">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white flex items-center gap-3">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                Campus Live Information Board
            </h1>
            <p class="text-sm text-slate-400 mt-1">Real-time approved student activity feeds</p>
        </div>
        <a href="index.html" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-semibold px-4 py-2 rounded-xl transition text-slate-300">
            ← Access Portal
        </a>
    </header>

    <main class="max-w-7xl mx-auto">
        <div id="displayBoardGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full p-12 text-center text-slate-500 font-medium bg-slate-900/40 rounded-2xl border border-slate-900 border-dashed animate-pulse">
                Synchronizing live grid interface matrix channels...
            </div>
        </div>
    </main>

    <script type="module">
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        async function loadPublicBoard() {
            const db = window.db;
            const grid = document.getElementById('displayBoardGrid');

            if (!db) {
                setTimeout(loadPublicBoard, 250);
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "bulletinSubmissions"));
                grid.innerHTML = "";
                let dynamicCardCount = 0;

                querySnapshot.forEach((docInstance) => {
                    const notice = docInstance.data();

                    // Strict validation filtering to block unapproved or pending requests
                    if (notice.status === 'approved') {
                        dynamicCardCount++;
                        
                        const badgeColor = notice.affiliationType === 'Faculty' ? 'bg-purple-500/10 text-purple-400 border-purple-500/20' : 'bg-blue-500/10 text-blue-400 border-blue-500/20';

                        const cardElement = document.createElement('div');
                        cardElement.className = "bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between shadow-xl hover:border-slate-700 transition duration-300 transform hover:-translate-y-1";
                        cardElement.innerHTML = `
                            <div class="space-y-4">
                                <div class="flex items-start justify-between gap-2">
                                    <span class="px-2.5 py-0.5 text-[10px] font-bold uppercase rounded-md border ${badgeColor}">
                                        ${notice.affiliationType || 'Club'}
                                    </span>
                                    <span class="text-[11px] font-mono font-medium text-slate-500 bg-slate-950 px-2 py-0.5 rounded-md">
                                        Date: ${notice.displayDate || '---'}
                                    </span>
                                </div>
                                <div>
                                    <h3 class="text-base font-bold text-white tracking-tight">${notice.affiliationName || 'General Announcement'}</h3>
                                    <p class="text-xs text-slate-400 mt-1 font-medium">Posted by: ${notice.fullName || 'Anonymous'}</p>
                                </div>
                                <div class="text-sm text-slate-300 leading-relaxed bg-slate-950/60 p-4 rounded-xl border border-slate-850 whitespace-pre-wrap break-words min-h-[80px]">
                                    ${notice.message || 'No announcement details specified.'}
                                </div>
                            </div>
                            <div class="mt-4 pt-3 border-t border-slate-850 flex justify-between text-[10px] font-mono text-slate-500">
                                <span>Ref: #${notice.id ? notice.id.slice(-6) : '000000'}</span>
                                <span class="text-emerald-500 font-bold uppercase tracking-wider flex items-center gap-1">
                                    <span class="w-1 h-1 rounded-full bg-emerald-500"></span> Verified Notice
                                </span>
                            </div>
                        `;
                        grid.appendChild(cardElement);
                    }
                });

                if (dynamicCardCount === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full p-16 text-center text-slate-500 font-medium bg-slate-900/30 rounded-2xl border border-slate-900 border-dashed">
                            No approved announcements are currently set for display.
                        </div>`;
                }

            } catch (err) {
                grid.innerHTML = `<div class="col-span-full p-4 text-center text-red-400 font-mono font-semibold bg-red-950/20 border border-red-900/50 rounded-xl">Terminal Linkage Loss: ${err.message}</div>`;
            }
        }

        loadPublicBoard();
    </script>
</body>
</html>
