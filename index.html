<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Campus Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./firebase.js"></script>
</head>
<body class="bg-slate-900 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 space-y-6">
        <div class="text-center">
            <h2 class="text-2xl font-bold text-slate-800">Campus Bulletin Gateway</h2>
            <p class="text-sm text-slate-500 mt-1">Sign in to access your dashboard</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                <input type="text" id="username" required placeholder="Your username" 
                    pattern="[A-Za-z0-9_]+" title="English characters, numbers, and underscores only."
                    oninput="this.value = this.value.replace(/[^A-Za-z0-9_]/g, '')"
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>

            <div id="errorMessage" class="text-red-500 text-xs hidden text-center font-medium bg-red-50 py-2 rounded-lg border border-red-100">
                Invalid username or password configuration.
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm">
                Sign In
            </button>
            
            <button type="button" id="guestBtn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-lg transition text-sm">
                Sign In as Guest
            </button>
        </form>

        <div class="border-t border-slate-100 pt-4 flex flex-col gap-2 text-center text-xs">
            <p class="text-slate-500">
                New student user? <a href="register.html" class="font-medium text-blue-600 hover:underline">Create an account here</a>
            </p>
            <a href="display.html" class="font-medium text-slate-400 hover:text-blue-600 underline mt-1">
                View Public Live Display Board →
            </a>
        </div>
    </div>

    <script type="module">
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const db = window.db;
            if (!db) {
                setTimeout(() => { document.getElementById('loginForm').requestSubmit(); }, 300);
                return;
            }

            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.classList.add('hidden');

            if (user === 'admin' && pass === 'admin') {
                sessionStorage.setItem('bulletinSessionRole', 'admin');
                window.location.href = 'admin.html';
                return;
            }

            try {
                const userDocRef = doc(db, "users", user);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    const userData = userDocSnap.data();
                    
                    if (userData.password === pass) {
                        sessionStorage.setItem('bulletinSessionRole', 'student');
                        sessionStorage.setItem('bulletinActiveStudent', JSON.stringify(userData));
                        window.location.href = 'submit.html';
                        return;
                    }
                }
                errorMsg.classList.remove('hidden');
            } catch (err) {
                alert("Database connection drop: " + err.message);
            }
        });

        document.getElementById('guestBtn').addEventListener('click', function() {
            sessionStorage.setItem('bulletinSessionRole', 'guest');
            sessionStorage.setItem('bulletinActiveStudent', JSON.stringify({
                username: "guest_user",
                fullName: "Guest Applicant",
                universityId: "0000000000",
                preferredEmail: "guest@example.com"
            }));
            window.location.href = 'submit.html';
        });
    </script>
</body>
</html>
