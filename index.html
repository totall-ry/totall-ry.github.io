<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Campus Bulletin Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./firebase.js"></script>
</head>
<body class="bg-slate-900 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 space-y-6">
        
        <div class="text-center">
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Account Sign In</h2>
            <p class="text-sm text-slate-500 mt-2">Access the campus digital billboard matrix</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="username" required placeholder="e.g. ryan_mok" 
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-800 bg-slate-50">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-800 bg-slate-50">
            </div>

            <div class="flex justify-end">
                <button type="button" onclick="bypassAsGuest()" class="text-xs font-semibold text-blue-600 hover:text-blue-700 hover:underline transition">
                    Access System as Guest Applicant →
                </button>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow-md">
                Sign In to Dashboard
            </button>
        </form>

        <div class="border-t border-slate-100 pt-4 text-center">
            <p class="text-xs text-slate-500">
                New student system member? 
                <a href="register.html" class="text-blue-600 font-bold hover:underline">Create Account</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const db = window.db; // Safe verification from initialized window instance

            if (!db) {
                alert("Database engine synchronization pending. Give it one brief moment.");
                return;
            }

            try {
                // 1. Point search criteria explicitly at your dynamic 'users' collection schema
                const userRef = doc(db, "users", usernameInput);
                const userSnap = await getDoc(userRef);

                // 2. Process conditional routing patterns if the document matches
                if (userSnap.exists()) {
                    const userData = userSnap.data();

                    // 3. Confirm password signature equality
                    if (userData.password === passwordInput) {
                        
                        // 4. Save session authorizations directly inside browser memory tracking blocks
                        sessionStorage.setItem('bulletinSessionRole', userData.role);
                        sessionStorage.setItem('bulletinActiveStudent', JSON.stringify({
                            fullName: userData.fullName || 'User Account',
                            username: usernameInput,
                            universityId: userData.universityId || 'GUEST-ID',
                            preferredEmail: userData.preferredEmail || ''
                        }));

                        // 5. Branch to the appropriate screen completely dynamically
                        if (userData.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else if (userData.role === 'student') {
                            window.location.href = 'submit.html';
                        } else {
                            alert('Access mapping error: Dynamic system authority type unknown.');
                        }
                        
                    } else {
                        alert('Authentication failure: Incorrect username or password details.');
                    }
                } else {
                    alert('Authentication failure: No registered user matches that username.');
                }

            } catch (err) {
                alert("Security handshake channel loss error: " + err.message);
            }
        });
    </script>

    <script>
        function bypassAsGuest() {
            sessionStorage.setItem('bulletinSessionRole', 'guest');
            sessionStorage.setItem('bulletinActiveStudent', JSON.stringify({
                fullName: 'Guest Applicant User',
                username: 'system_guest',
                universityId: '0000000000',
                preferredEmail: 'guest@university.edu'
            }));
            window.location.href = 'submit.html';
        }
    </script>
</body>
</html>
