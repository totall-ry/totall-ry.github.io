<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Campus Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 space-y-6">
        <div class="text-center">
            <h2 class="text-2xl font-bold text-slate-800">Campus Bulletin Gateway</h2>
            <p class="text-sm text-slate-500 mt-1">Sign in to access your dashboard</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                <input type="text" id="username" required placeholder="Your custom username or 'admin'" 
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>

            <div id="errorMessage" class="text-red-500 text-xs hidden text-center font-medium bg-red-50 py-2 rounded-lg border border-red-100">
                Invalid username or password configuration.
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm">
                Sign In
            </button>
        </form>

        <div class="border-t border-slate-100 pt-4 flex flex-col gap-2 text-center text-xs">
            <p class="text-slate-500">
                New student user? <a href="register.html" class="font-medium text-blue-600 hover:underline">Create an account here</a>
            </p>
            <a href="display.html" class="font-medium text-slate-400 hover:text-blue-600 underline mt-1">
                View Public Live Display Board →
            </a>
        </div>
    </div>

    <script>
        // Bootstrap systemic infrastructure tables if missing from client
        if (!localStorage.getItem('bulletinUsers')) localStorage.setItem('bulletinUsers', JSON.stringify([]));
        if (!localStorage.getItem('bulletinSubmissions')) localStorage.setItem('bulletinSubmissions', JSON.stringify([]));

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            errorMsg.classList.add('hidden');

            // 1. Check Admin Credentials Override
            if (user === 'admin' && pass === 'admin') {
                sessionStorage.setItem('bulletinSessionRole', 'admin');
                window.location.href = 'admin.html';
                return;
            }

            // 2. Scan Client Database for Student Match
            const users = JSON.parse(localStorage.getItem('bulletinUsers'));
            const matchingUser = users.find(u => u.username === user);

            if (matchingUser && matchingUser.password === pass) {
                // Initialize state validation parameters securely across execution tabs
                sessionStorage.setItem('bulletinSessionRole', 'student');
                sessionStorage.setItem('bulletinActiveStudent', JSON.stringify(matchingUser));
                window.location.href = 'submit.html';
            } else {
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
