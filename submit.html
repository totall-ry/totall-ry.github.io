<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Request | Campus Bulletin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="firebase.js"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-4xl w-full overflow-hidden grid md:grid-cols-5">
        <div class="bg-blue-600 p-8 text-white md:col-span-2 flex flex-col justify-between">
            <div>
                <h2 class="text-2xl font-bold mb-4">Campus Bulletin Board</h2>
                <p class="text-blue-100 text-sm leading-relaxed">Welcome back, <b id="sideName">Applicant</b>! Route your announcement directly onto campus billboard displays.</p>
            </div>
            <div class="text-xs text-blue-200 space-y-2">
                <p>• Session Mode: <span id="sideUsername" class="font-mono text-white">---</span></p>
                <p class="pt-4 border-t border-blue-500/50"><a href="#" onclick="logOut()" class="underline hover:text-white font-semibold">Sign Out / Log Exit</a></p>
            </div>
        </div>

        <form id="submissionForm" class="p-8 md:col-span-3 space-y-4">
            <h3 class="text-xl font-semibold text-slate-800 mb-2">Request Form</h3>
            
            <div id="dynamicProfileContainer" class="space-y-4">
                </div>

            <div class="grid grid-cols-3 gap-4">
                <div class="col-span-1">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Type</label>
                    <select id="affiliationType" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm bg-white">
                        <option value="Club">Club</option>
                        <option value="Faculty">Faculty</option>
                    </select>
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Club / Faculty Name</label>
                    <input type="text" id="affiliationName" required placeholder="e.g. Chess Club, Computer Science" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Target Display Date</label>
                <input type="date" id="displayDate" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Message to Display</label>
                <textarea id="message" rows="3" required maxlength="250" placeholder="Max 250 characters..." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm resize-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm">
                Submit Request
            </button>
        </form>
    </div>

    <script type="module">
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        const currentRole = sessionStorage.getItem('bulletinSessionRole');
        const activeUserData = JSON.parse(sessionStorage.getItem('bulletinActiveStudent'));
        const container = document.getElementById('dynamicProfileContainer');

        if (!currentRole || !activeUserData) {
            alert('Access denied. Please log in.');
            window.location.href = 'index.html';
        }

        // Apply metadata interface features
        document.getElementById('sideName').innerText = activeUserData.fullName;
        document.getElementById('sideUsername').innerText = currentRole.toUpperCase();

        // Check user state to dynamically adjust permissions
        if (currentRole === 'student') {
            // Student Mode: Render fields as read-only labels
            container.innerHTML = `
                <div class="grid grid-cols-2 gap-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase">Applicant</label><p class="text-sm font-medium text-slate-700">${activeUserData.fullName}</p></div>
                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase">University ID Reference</label><p class="text-sm font-mono font-medium text-slate-700">${activeUserData.universityId}</p></div>
                    <div class="col-span-2 border-t border-slate-200 pt-2"><label class="block text-[10px] font-bold text-slate-400 uppercase">Notification Routing Address</label><p class="text-sm font-medium text-slate-700">${activeUserData.preferredEmail}</p></div>
                </div>`;
        } else {
            // Guest Mode: Keep input fields open and fully editable
            container.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Full Name</label><input type="text" id="guestFullName" required placeholder="Guest Name" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">University ID</label><input type="text" id="guestUid" required minlength="10" maxlength="10" pattern="[0-9]*" title="Must be exactly 10 digits." placeholder="10 Digits" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"></div>
                    <div class="col-span-2"><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Preferred Email</label><input type="email" id="guestEmail" required placeholder="your@email.com" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"></div>
                </div>`;
        }

        document.getElementById('submissionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let finalName = activeUserData.fullName;
            let finalUid = activeUserData.universityId;
            let finalEmail = activeUserData.preferredEmail;

            if (currentRole === 'guest') {
                finalName = document.getElementById('guestFullName').value.trim();
                finalUid = document.getElementById('guestUid').value;
                finalEmail = document.getElementById('guestEmail').value.trim();
            }

            const submissionId = Date.now().toString();
            const payload = {
                id: submissionId,
                username: activeUserData.username,
                fullName: finalName,
                universityId: finalUid,
                preferredEmail: finalEmail,
                affiliationType: document.getElementById('affiliationType').value,
                affiliationName: document.getElementById('affiliationName').value.trim(),
                displayDate: document.getElementById('displayDate').value,
                message: document.getElementById('message').value.trim(),
                status: 'pending'
            };

            try {
                // Route payload straight to your live cloud collections database root snap
                await setDoc(doc(window.db, "submissions", submissionId), payload);
                alert('Notice request successfully saved onto cloud database queue!');
                this.reset();
                if (currentRole === 'guest') {
                    document.getElementById('guestFullName').value = '';
                    document.getElementById('guestUid').value = '';
                    document.getElementById('guestEmail').value = '';
                }
            } catch (err) {
                alert("Database save rejection error: " + err.message);
            }
        });
    </script>
    <script>
        function logOut() { sessionStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
