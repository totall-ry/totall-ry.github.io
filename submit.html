<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Request | Campus Bulletin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-4xl w-full overflow-hidden grid md:grid-cols-5">
        <div class="bg-blue-600 p-8 text-white md:col-span-2 flex flex-col justify-between">
            <div>
                <h2 class="text-2xl font-bold mb-4">Campus Bulletin Board</h2>
                <p class="text-blue-100 text-sm leading-relaxed">
                    Submit your announcement, event, or message to be featured on the university display boards.
                </p>
            </div>
            <div class="mt-8 md:mt-0 text-xs text-blue-200">
                <p>• Review takes 1-2 business days.</p>
                <p class="mt-1">• You will receive an email notification upon approval.</p>
                <p class="mt-4 pt-4 border-t border-blue-500/50"><a href="index.html" class="underline hover:text-white">← Back to Login</a></p>
            </div>
        </div>

        <form id="submissionForm" class="p-8 md:col-span-3 space-y-4">
            <h3 class="text-xl font-semibold text-slate-800 mb-2">Request Form</h3>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Full Name</label>
                    <input type="text" name="fullName" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">University ID</label>
                    <input
                        type="text"
                        name="universityId"
                        required
                        minlength="10"
                        maxlength="10"
                        pattern="[0-9]*"
                        title="University ID must be exactly 10 digits long and contain only numbers."
                        placeholder="e.g. 1234567890"
                        class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm"
                    >
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Preferred Email</label>
                <input type="email" name="preferredEmail" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div class="col-span-1">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Affiliation Type</label>
                    <select name="affiliationType" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm bg-white">
                        <option value="Club">Club</option>
                        <option value="Faculty">Faculty</option>
                    </select>
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Club / Faculty Name</label>
                    <input type="text" name="affiliationName" required placeholder="e.g. Chess Club, Computer Science" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Target Display Date</label>
                <input type="date" name="displayDate" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Message to Display</label>
                <textarea name="message" rows="3" required maxlength="250" placeholder="Max 250 characters..." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm resize-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm mt-2">
                Submit Request
            </button>
        </form>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        const form = document.getElementById('submissionForm');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const newSubmission = {
                fullName: this.fullName.value.trim(),
                universityId: this.universityId.value.trim(),
                preferredEmail: this.preferredEmail.value.trim(),
                affiliationType: this.affiliationType.value,
                affiliationName: this.affiliationName.value.trim(),
                displayDate: this.displayDate.value,
                message: this.message.value.trim(),
                status: 'pending',
                createdAt: serverTimestamp()
            };

            const button = this.querySelector('button[type="submit"]');
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = 'Submitting...';

            try {
                await addDoc(collection(db, "bulletinSubmissions"), newSubmission);
                alert('Submission sent successfully!');
                this.reset();
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Submission failed:', error);
                alert('Submission failed. Please try again.');
            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        });
    </script>
</body>
</html>
