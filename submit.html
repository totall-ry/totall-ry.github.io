<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Request | Campus Bulletin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-4xl w-full overflow-hidden grid md:grid-cols-5">
        <div class="bg-blue-600 p-8 text-white md:col-span-2 flex flex-col justify-between">
            <div>
                <h2 class="text-2xl font-bold mb-4">Campus Bulletin Board</h2>
                <p class="text-blue-100 text-sm leading-relaxed">Welcome back, <b id="sideName">Student</b>! Submit your announcement to be featured live across the network display array.</p>
            </div>
            <div class="text-xs text-blue-200 space-y-2">
                <p>• Account session: <span id="sideUsername" class="font-mono text-white">---</span></p>
                <p class="pt-4 border-t border-blue-500/50"><a href="#" onclick="logOut()" class="underline hover:text-white font-semibold">Sign Out / Log Exit</a></p>
            </div>
        </div>

        <form id="submissionForm" class="p-8 md:col-span-3 space-y-4">
            <h3 class="text-xl font-semibold text-slate-800 mb-2">Request Form</h3>
            
            <div class="grid grid-cols-2 gap-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase">Applicant</label>
                    <p id="profName" class="text-sm font-medium text-slate-700 mt-0.5">---</p>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase">University ID Reference</label>
                    <p id="profUid" class="text-sm font-mono font-medium text-slate-700 mt-0.5">---</p>
                </div>
                <div class="col-span-2 border-t border-slate-200/60 pt-2 mt-1">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase">Notification Routing Address</label>
                    <p id="profEmail" class="text-sm font-medium text-slate-700 mt-0.5">---</p>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div class="col-span-1">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Type</label>
                    <select name="affiliationType" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm bg-white">
                        <option value="Club">Club</option>
                        <option value="Faculty">Faculty</option>
                    </select>
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Club / Faculty Name</label>
                    <input type="text" name="affiliationName" required placeholder="e.g. Chess Club, Computer Science" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Target Display Date</label>
                <input type="date" name="displayDate" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Message to Display</label>
                <textarea name="message" rows="3" required maxlength="250" placeholder="Max 250 characters..." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm resize-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm">
                Submit Request
            </button>
        </form>
    </div>

    <script>
        // Authentication Route Shield Guard Validation Checks
        const currentRole = sessionStorage.getItem('bulletinSessionRole');
        const activeUserData = JSON.parse(sessionStorage.getItem('bulletinActiveStudent'));

        if (currentRole !== 'student' || !activeUserData) {
            alert('Access denied. Please log into an authorized account profile configuration wrapper.');
            window.location.href = 'index.html';
        } else {
            // Seed profile parameters cleanly onto interface fields dynamically
            document.getElementById('sideName').innerText = activeUserData.fullName;
            document.getElementById('sideUsername').innerText = activeUserData.username;
            document.getElementById('profName').innerText = activeUserData.fullName;
            document.getElementById('profUid').innerText = activeUserData.universityId;
            document.getElementById('profEmail').innerText = activeUserData.preferredEmail;
        }

        document.getElementById('submissionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newSubmission = {
                id: Date.now().toString(),
                username: activeUserData.username,
                fullName: activeUserData.fullName,
                universityId: activeUserData.universityId,
                preferredEmail: activeUserData.preferredEmail,
                affiliationType: this.affiliationType.value,
                affiliationName: this.affiliationName.value,
                displayDate: this.displayDate.value,
                message: this.message.value,
                status: 'pending'
            };

            const submissions = JSON.parse(localStorage.getItem('bulletinSubmissions')) || [];
            submissions.push(newSubmission);
            localStorage.setItem('bulletinSubmissions', JSON.stringify(submissions));
            
            alert('Notice request successfully routed into database review queue!');
            this.reset();
        });

        function logOut() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
