<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual HUB75 Campus LED Ticker</title>

<style>
body {
    margin: 0;
    background: #020202;
    overflow: hidden;
    min-height: 100vh;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
        radial-gradient(circle at 20% 20%, rgba(255,0,0,0.08), transparent 16%),
        radial-gradient(circle at 80% 25%, rgba(255,0,0,0.05), transparent 18%);
    background-size: 16px 16px, 16px 16px, 100% 100%, 100% 100%;
    mix-blend-mode: screen;
}

#led {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    overflow: hidden;
}

#led::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.03), transparent 40%);
    pointer-events: none;
}

.marquee {
    color: #ff4040;
    font-size: 180px; 
    font-family: "Courier New", Courier, monospace;
    font-weight: 900;
    white-space: nowrap;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    position: absolute;
    padding: 20px 40px;
    border-radius: 30px;
    background: rgba(0,0,0,0.18);
    box-shadow:
        inset 0 0 30px rgba(255, 80, 80, 0.08),
        0 0 40px rgba(255, 40, 40, 0.10);
    display: flex; 
    flex-direction: row;
    flex-wrap: nowrap;
    animation: scroll var(--scroll-duration, 60s) linear infinite;
}

.marquee span {
    display: inline-block;
    position: relative;
    line-height: 1;
    padding: 0 1px;
    flex-shrink: 0; 
    text-shadow:
        0 0 2px rgba(255,255,255,0.9),
        0 0 8px rgba(255,100,100,0.85),
        0 0 16px rgba(255,80,80,0.75);
}

.marquee span::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 2px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
}

.marquee span:nth-child(4n+1) { opacity: 0.95; }
.marquee span:nth-child(4n+2) { opacity: 0.85; }
.marquee span:nth-child(4n+3) { opacity: 0.78; }
.marquee span:nth-child(4n)   { opacity: 0.9; }

@keyframes scroll {
    from { transform: translateX(100vw); }
    to   { transform: translateX(-100%); }
}

#status {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 1000;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.1);
    pointer-events: none;
    transition: opacity 1s ease-in-out;
}
</style>
</head>

<body>

<div id="led">
    <div id="status">Initializing Matrix...</div>
    <div class="marquee" id="msg">Loading Bulletin Feed...</div>
</div>

<script type="module">
import { db } from "./firebase.js";
import {
    collection,
    query,
    where,
    onSnapshot,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

function parseTimestamp(value) {
    if (!value) return 0;
    if (typeof value === 'number') return value;
    if (typeof value === 'string') {
        const n = Date.parse(value);
        return Number.isFinite(n) ? n : 0;
    }
    if (value?.seconds) return value.seconds * 1000;
    if (typeof value.toDate === 'function') return value.toDate().getTime();
    return 0;
}

const statusEl = document.getElementById('status');

if (window.location.protocol === 'file:') {
    statusEl.textContent = 'Warning: open via http(s) (e.g. python -m http.server), not file://';
    throw new Error('Page served over file:// - execution blocked.');
}

function renderMessages(items) {
    const display = document.getElementById("msg");

    if (items.length === 0) {
        display.innerHTML = "<span>NO</span><span>&nbsp;</span><span>ACTIVE</span><span>&nbsp;</span><span>BULLETINS</span>";
        display.style.setProperty("--scroll-duration", "15s");
        return;
    }

    // Sort items chronologically (newest first)
    items.sort((a, b) => parseTimestamp(b.createdAt) - parseTimestamp(a.createdAt));

    const messages = items.map(item => {
        const title = item.affiliationName || "Campus Announcement";
        const content = item.message || "(No message)";
        const timeString = item.displayTime ? ` @ ${item.displayTime}` : '';
        const deadline = item.displayDate ? ` [ENDS: ${item.displayDate}${timeString}]` : "";
        return `${title}: "${content}"${deadline}`;
    });

    const rawText = messages.join("          ◆          ");
    
    display.innerHTML = rawText.split("").map((char) => {
        if (char === " ") return `<span>&nbsp;</span>`;
        if (char === "◆") return `<span style="color:#ffa080;">◆</span>`;
        return `<span>${char}</span>`;
    }).join("");

    // Dynamically calculate speed based on character length so it scrolls smoothly
    const textWidth = display.scrollWidth || (rawText.length * 120);
    const calculatedDuration = Math.max(Math.round(textWidth / 150), 20); 
    display.style.setProperty("--scroll-duration", `${calculatedDuration}s`);
}

const q = query(
    collection(db, "bulletinSubmissions"),
    where("status", "==", "approved")
);

onSnapshot(q, async (snapshot) => {
    // Generate Hong Kong Time checkpoints
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const date = String(now.getDate()).padStart(2, '0');
    const todayString = `${year}-${month}-${date}`;

    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const currentTimeString = `${hours}:${minutes}`;

    const activeItems = [];
    const autoRevokePromises = [];

    snapshot.forEach(docSnap => {
        const item = docSnap.data();
        
        // Expiry verification rules (True if calendar date is past, or if today but time is past)
        const isPastDate = item.displayDate < todayString;
        const isPastTimeToday = (item.displayDate === todayString && item.displayTime && item.displayTime <= currentTimeString);

        if (isPastDate || isPastTimeToday) {
            console.log(`Auto-revoking expired matrix notice reference: ${docSnap.id}`);
            const docRef = doc(db, "bulletinSubmissions", docSnap.id);
            autoRevokePromises.push(updateDoc(docRef, {
                status: "denied",
                logNotes: "Rejected: Revoked automatically by system due to schedule expiration."
            }));
        } else {
            activeItems.push(item);
        }
    });

    // Commit any automated cleanups to Firestore concurrently
    if (autoRevokePromises.length > 0) {
        try {
            await Promise.all(autoRevokePromises);
        } catch (err) {
            console.error("LED self-cleaning engine database write fault:", err);
        }
    }

    if (statusEl) {
        statusEl.textContent = activeItems.length === 0 ? 'No active tickers approved.' : 'Live LED Sync Operational';
        setTimeout(() => { statusEl.style.opacity = '0.2'; }, 4000); // Fades out the status indicator after initialization
    }

    renderMessages(activeItems);
}, (error) => {
    console.error("Live snapshot failed:", error);
    if (statusEl) {
        statusEl.style.opacity = '1';
        statusEl.textContent = 'Firestore sync error: ' + error.message;
    }
    document.getElementById("msg").innerText = "Database connection fault.";
});
</script>

</body>
</html>
